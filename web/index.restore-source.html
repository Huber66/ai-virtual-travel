<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 虚拟文旅打卡馆</title>
    <link rel="stylesheet" href="/static/app.css?v=20260417-custom-head1" />
  </head>
  <body>
    <div class="page-shell">
      <main class="studio-grid studio-grid-input-only">
        <section class="panel upload-panel">
          <div class="panel-header panel-header-large">
            <div>
              <h2>素材工作台</h2>
            </div>
          </div>

          <div class="preview-grid" id="upload-workbench">
            <div class="dropzone source-dropzone">
              <div class="dropzone-head">
                <div>
                  <span class="dropzone-title">人物照</span>
                </div>
                <div class="camera-toolbar camera-toolbar-head">
                  <input id="source-image" name="person_image" type="file" accept="image/*" />
                  <button id="open-camera-button" class="secondary-button" type="button">📷 打开摄像头</button>
                  <button id="capture-camera-button" class="secondary-button" type="button" disabled>📸 拍照</button>
                  <button id="close-camera-button" class="secondary-button" type="button" disabled>关闭镜头</button>
                </div>
              </div>

              <div class="preview-shell">
                <video id="source-camera" class="preview hidden" autoplay playsinline muted></video>
                <img id="source-preview" class="preview hidden" alt="人物照预览" />
              </div>
            </div>

            <div class="dropzone background-mode-shell">
              <div class="dropzone-head">
                <div>
                  <span class="dropzone-title">背景模式</span>
                </div>
                <div id="custom-upload-shell" class="hidden">
                  <div class="custom-upload-row">
                    <input id="target-image" name="background_image" type="file" accept="image/*" />
                    <a class="secondary-button custom-scene-switch" href="/">切换场景</a>
                  </div>
                </div>
              </div>

              <div id="image-mode-section" class="background-mode-panel">
                <div class="preview-shell">
                  <img id="target-preview" class="preview hidden" alt="背景图预览" />
                </div>
              </div>

            </div>
          </div>

          <div id="gallery-shell" class="gallery-shell gallery-shell-wide">
            <div class="gallery-header">
              <div>
                <h3>文旅背景预览</h3>
              </div>
              <div class="gallery-toolbar">
                <div class="gallery-scene-meta">
                  <span>当前场景</span>
                  <div class="gallery-scene-line">
                    <strong id="scene-label">北京</strong>
                    <a class="gallery-scene-link" href="/">切换场景</a>
                  </div>
                </div>
                <p id="gallery-status">正在加载背景...</p>
              </div>
            </div>
            <div id="template-gallery" class="template-gallery"></div>
          </div>

          <div class="actions">
            <div class="actions-copy">
              <p id="status-text" class="status-text">等待上传人物照</p>
            </div>
            <button id="submit-button" class="primary-button" type="button">开始打卡</button>
          </div>
        </section>

        <section class="panel result-panel hidden" aria-hidden="true">
          <div class="panel-header panel-header-large">
            <div>
              <h2>打卡结果</h2>
            </div>
          </div>

          <div class="result-stage">
            <div class="result-stage-top">
              <div class="result-stage-badge">📸 预览区</div>
            </div>

            <div id="result-placeholder" class="result-placeholder">
              <div class="placeholder-inner">
                <div class="placeholder-camera">📸</div>
                <p>预览区</p>
              </div>
            </div>

            <img id="result-image" class="result-image hidden" alt="文旅打卡结果" />
          </div>

          <div class="result-action-row">
            <a id="download-link" class="secondary-link is-disabled" download="travel-checkin-result.png" aria-disabled="true">下载保存</a>
            <button id="regenerate-button" class="ghost-button" type="button" disabled>再生成一组</button>
          </div>

          <div id="share-panel" class="share-panel hidden">
            <div class="share-copy-block">
              <h3>扫码下载原图</h3>
              <p id="share-hint" class="share-hint">生成完成后会自动创建二维码，微信扫码即可打开下载页。</p>
              <a id="share-link" class="share-link" href="#" target="_blank" rel="noreferrer">打开下载页</a>
            </div>

            <div class="share-qr-card">
              <img id="share-qr-image" class="share-qr-image" alt="文旅打卡结果下载二维码" />
            </div>
          </div>

          <div id="result-meta" class="result-meta hidden">
            <span id="prompt-id"></span>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/app.js?v=20260616-https-lan1"></script>
  </body>
</html>
